<!doctype html>
<meta charset="utf-8">
<title>CRT DEMO &mdash; 256 EFFECTS</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;cursor:none}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;-ms-interpolation-mode:nearest-neighbor;display:block}
  #hud{position:fixed;left:8px;bottom:6px;font:11px monospace;color:#0f0;opacity:0;transition:opacity .3s;pointer-events:none;text-shadow:0 0 4px #0f0}
  #hud.on{opacity:.75}
</style>
<canvas id="c"></canvas>
<div id="hud">256 EFFECTS &middot; SPACE/&larr;&rarr; scene &middot; R random &middot; P hold &middot; N names &middot; F fullscreen</div>
<script>
(() => {
"use strict";

// ---------------------------------------------------------------- framebuffer
const W = 200, H = 150;
const cv = document.getElementById('c');
cv.width = W; cv.height = H;
const ctx = cv.getContext('2d', { alpha:false });
ctx.imageSmoothingEnabled = false;

const imgA = ctx.createImageData(W, H);
const A = new Uint32Array(imgA.data.buffer);   // current scene
const B = new Uint32Array(W * H);              // incoming scene
const OUT = A;                                 // we blend into A

const rgb = (r,g,b) => 0xff000000 | ((b&255)<<16) | ((g&255)<<8) | (r&255);
const clamp = (v,a,b) => v<a?a:v>b?b:v;

// cosine gradient palette -> Uint32Array(n)
function pal(n, a, b, c, d) {
  const p = new Uint32Array(n);
  for (let i=0;i<n;i++){
    const t = i/(n-1);
    const r = clamp((a[0]+b[0]*Math.cos(6.28318*(c[0]*t+d[0])))*255,0,255)|0;
    const g = clamp((a[1]+b[1]*Math.cos(6.28318*(c[1]*t+d[1])))*255,0,255)|0;
    const bl= clamp((a[2]+b[2]*Math.cos(6.28318*(c[2]*t+d[2])))*255,0,255)|0;
    p[i] = rgb(r,g,bl);
  }
  return p;
}

// gradient from keyed stops -> Uint32Array(n)
function stops(n, st){
  const p = new Uint32Array(n);
  for (let i=0;i<n;i++){
    const t=i/(n-1);
    let k=0; while(k<st.length-2 && t>st[k+1][0]) k++;
    const a=st[k], b=st[k+1];
    const f=clamp((t-a[0])/(b[0]-a[0]||1),0,1);
    p[i]=rgb((a[1][0]+(b[1][0]-a[1][0])*f)|0,(a[1][1]+(b[1][1]-a[1][1])*f)|0,(a[1][2]+(b[1][2]-a[1][2])*f)|0);
  }
  return p;
}

// 8x8 ordered dither matrix (0..63)
const BY = new Uint8Array([
   0,32, 8,40, 2,34,10,42,
  48,16,56,24,50,18,58,26,
  12,44, 4,36,14,46, 6,38,
  60,28,52,20,62,30,54,22,
   3,35,11,43, 1,33, 9,41,
  51,19,59,27,49,17,57,25,
  15,47, 7,39,13,45, 5,37,
  63,31,55,23,61,29,53,21]);
const bay = (x,y) => BY[((y&7)<<3)|(x&7)];

// ---------------------------------------------------------------- text masks
const tcv = document.createElement('canvas');
const tcx = tcv.getContext('2d', { willReadFrequently:true });
function textMask(str, px, font) {
  tcx.font = `bold ${px}px ${font||'monospace'}`;
  const w = Math.ceil(tcx.measureText(str).width) + 4;
  const h = px + 6;
  tcv.width = w; tcv.height = h;
  tcx.font = `bold ${px}px ${font||'monospace'}`;
  tcx.textBaseline = 'top';
  tcx.clearRect(0,0,w,h);
  tcx.fillStyle = '#fff';
  tcx.fillText(str, 2, 3);
  const d = tcx.getImageData(0,0,w,h).data;
  const a = new Uint8Array(w*h);
  for (let i=0;i<w*h;i++) a[i] = d[i*4+3] > 110 ? 1 : 0;
  return { w, h, a };
}


// ---------------------------------------------------------------- raster helpers
function line(T,x0,y0,x1,y1,col){
  x0=x0|0;y0=y0|0;x1=x1|0;y1=y1|0;
  const dx=Math.abs(x1-x0), sx=x0<x1?1:-1;
  const dy=-Math.abs(y1-y0), sy=y0<y1?1:-1;
  let err=dx+dy, n=0;
  for(;;){
    if(x0>=0&&x0<W&&y0>=0&&y0<H) T[y0*W+x0]=col;
    if((x0===x1&&y0===y1) || ++n>900) break;
    const e2=err*2;
    if(e2>=dy){err+=dy;x0+=sx;}
    if(e2<=dx){err+=dx;y0+=sy;}
  }
}
function tri(T,ax,ay,bx,by,cx,cy,col){
  let t;
  if(ay>by){t=ax;ax=bx;bx=t;t=ay;ay=by;by=t;}
  if(ay>cy){t=ax;ax=cx;cx=t;t=ay;ay=cy;cy=t;}
  if(by>cy){t=bx;bx=cx;cx=t;t=by;by=cy;cy=t;}
  const tot=cy-ay; if(tot<=0) return;
  const y0=Math.max(0,Math.ceil(ay)), y1=Math.min(H-1,Math.floor(cy));
  for(let y=y0;y<=y1;y++){
    const second = y>by;
    const segH = second ? cy-by : by-ay;
    const fa = (y-ay)/tot;
    const fb = segH<=0 ? 0 : (y-(second?by:ay))/segH;
    let xa = ax+(cx-ax)*fa;
    let xb = second ? bx+(cx-bx)*fb : ax+(bx-ax)*fb;
    if(xa>xb){const q=xa;xa=xb;xb=q;}
    let px0=Math.max(0,Math.ceil(xa)), px1=Math.min(W-1,Math.floor(xb));
    const row=y*W;
    for(let x=px0;x<=px1;x++) T[row+x]=col;
  }
}
function addp(T,x,y,r,g,b){
  x=x|0;y=y|0;
  if(x<0||y<0||x>=W||y>=H)return;
  const i=y*W+x, c=T[i];
  let R=(c&255)+r, G=((c>>8)&255)+g, B=((c>>16)&255)+b;
  if(R>255)R=255; if(G>255)G=255; if(B>255)B=255;
  T[i]=0xff000000|(B<<16)|(G<<8)|R;
}
function fadeBuf(T,f){
  for(let i=0;i<T.length;i++){
    const c=T[i];
    T[i]=0xff000000|((((c>>16)&255)*f|0)<<16)|((((c>>8)&255)*f|0)<<8)|((c&255)*f|0);
  }
}
function vgrad(T,top,bot){
  for(let y=0;y<H;y++){
    const f=y/(H-1);
    const c=rgb(top[0]+(bot[0]-top[0])*f|0, top[1]+(bot[1]-top[1])*f|0, top[2]+(bot[2]-top[2])*f|0);
    T.fill(c,y*W,y*W+W);
  }
}
// value noise
function hash2(x,y){
  let n = Math.imul(x|0,0x27d4eb2d) ^ Math.imul(y|0,0x165667b1);
  n = Math.imul(n ^ (n>>>15), 0x2545f491);
  n ^= n>>>13;
  n = Math.imul(n, 0x27d4eb2d);
  return ((n ^ (n>>>16))>>>0)/4294967296;
}
function vnoise(x,y){
  const xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi;
  const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
  const a=hash2(xi,yi), b=hash2(xi+1,yi), c=hash2(xi,yi+1), d=hash2(xi+1,yi+1);
  return (a+(b-a)*u) + ((c+(d-c)*u)-(a+(b-a)*u))*v;
}
function fbm(x,y,oct){
  let s=0,amp=0.5,f=1;
  for(let i=0;i<oct;i++){ s+=vnoise(x*f,y*f)*amp; f*=2; amp*=0.5; }
  return s;
}


// ---------------------------------------------------------------- pixel ops
function pset(T,x,y,c){ x=x|0;y=y|0; if(x>=0&&y>=0&&x<W&&y<H) T[y*W+x]=c; }
function pget(T,x,y){ x=x|0;y=y|0; return (x>=0&&y>=0&&x<W&&y<H)?T[y*W+x]:0xff000000; }
function hline(T,x0,x1,y,c){ y=y|0; if(y<0||y>=H)return; if(x0>x1){const t=x0;x0=x1;x1=t;}
  x0=x0<0?0:x0|0; x1=x1>=W?W-1:x1|0; const r=y*W; for(let x=x0;x<=x1;x++)T[r+x]=c; }
function vline(T,x,y0,y1,c){ x=x|0; if(x<0||x>=W)return; if(y0>y1){const t=y0;y0=y1;y1=t;}
  y0=y0<0?0:y0|0; y1=y1>=H?H-1:y1|0; for(let y=y0;y<=y1;y++)T[y*W+x]=c; }
function rect(T,x,y,w,h,c){ for(let j=0;j<h;j++) hline(T,x,x+w-1,y+j,c); }
function box2(T,x,y,w,h,c){ hline(T,x,x+w-1,y,c); hline(T,x,x+w-1,y+h-1,c); vline(T,x,y,y+h-1,c); vline(T,x+w-1,y,y+h-1,c); }
function disc(T,cx,cy,r,c){ const r2=r*r; for(let y=-r;y<=r;y++){ const s=Math.sqrt(r2-y*y)|0; hline(T,cx-s,cx+s,cy+y,c); } }
function ring(T,cx,cy,r,c){ for(let a=0;a<360;a+=2){ const t=a*0.0174533; pset(T,cx+Math.cos(t)*r,cy+Math.sin(t)*r,c); } }
function hexpal(a){ const p=new Uint32Array(a.length); for(let i=0;i<a.length;i++){const v=a[i]; p[i]=rgb((v>>16)&255,(v>>8)&255,v&255);} return p; }
// ascii-art sprite: '.'/' ' transparent, digits = palette index, any other char = 1
function spr(rows){ const h=rows.length, w=rows[0].length, a=new Uint8Array(w*h);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){ const ch=rows[y][x];
    a[y*w+x]=(ch===' '||ch==='.')?0:((ch>='0'&&ch<='9')?+ch:1); }
  return {w,h,a}; }
function blit(T,s,x,y,pal,flip){
  for(let j=0;j<s.h;j++){ const py=(y+j)|0; if(py<0||py>=H)continue; const r=py*W;
    for(let i=0;i<s.w;i++){ const v=s.a[j*s.w+(flip?s.w-1-i:i)]; if(!v)continue;
      const q=(x+i)|0; if(q<0||q>=W)continue; T[r+q]=pal[v]; } } }
function blit2(T,s,x,y,pal,sc){
  for(let j=0;j<s.h;j++)for(let i=0;i<s.w;i++){ const v=s.a[j*s.w+i]; if(!v)continue;
    rect(T,x+i*sc,y+j*sc,sc,sc,pal[v]); } }

// ---------------------------------------------------------------- hardware palettes
const C64 = hexpal([0x000000,0xFFFFFF,0x813338,0x75CEC8,0x8E3C97,0x56AC4D,0x2E2C9B,0xEDF171,
                    0x8E5029,0x553800,0xC46C71,0x4A4A4A,0x7B7B7B,0xA9FF9F,0x706DEB,0xB2B2B2]);
const NESP = hexpal([0x000000,0xFCFCFC,0xF8F8F8,0xBCBCBC,0x7C7C7C,0x0000FC,0x0078F8,0x3CBCFC,
                     0xA4E4FC,0x0000BC,0x4428BC,0x6888FC,0xB8B8F8,0x940084,0xD800CC,0xF878F8,
                     0xA80020,0xE40058,0xF85898,0xF8B8B8,0xA81000,0xF83800,0xFCA044,0xF8D8B8,
                     0x503000,0xE45C10,0xF8B800,0xFCE0A8,0x007800,0x00B800,0xB8F818,0xD8F878,
                     0x006800,0x00A800,0x58D854,0xB8F8B8,0x005800,0x00A844,0x58F898,0xB8F8D8,
                     0x004058,0x008888,0x00E8D8,0x00FCFC]);
const GB  = hexpal([0x0F380F,0x306230,0x8BAC0F,0x9BBC0F]);
const ZX  = hexpal([0x000000,0x0000D7,0xD70000,0xD700D7,0x00D700,0x00D7D7,0xD7D700,0xD7D7D7,
                    0x000000,0x0000FF,0xFF0000,0xFF00FF,0x00FF00,0x00FFFF,0xFFFF00,0xFFFFFF]);
const CGA = hexpal([0x000000,0x55FFFF,0xFF55FF,0xFFFFFF]);
const AMI = hexpal([0x000000,0x1122AA,0xFFFFFF,0xFF7700,0x22CC44,0xDD2255,0xFFDD22,0x8844CC]);

// ---------------------------------------------------------------- scenes
const scenes = [];
const TAU = Math.PI*2;

/* 1. PLASMA -------------------------------------------------------------- */
{
  const P = pal(64, [.5,.5,.5],[.5,.5,.5],[1,1,1],[0,.33,.67]);
  const P2 = pal(64, [.6,.4,.5],[.5,.5,.5],[1,1,.6],[.1,.5,.8]);
  const dist = new Float32Array(W*H), dist2 = new Float32Array(W*H);
  for (let y=0,i=0;y<H;y++) for (let x=0;x<W;x++,i++){
    const dx=x-W*0.5, dy=y-H*0.5;
    dist[i]=Math.sqrt(dx*dx+dy*dy);
    const ex=x-W*0.18, ey=y-H*0.85;
    dist2[i]=Math.sqrt(ex*ex+ey*ey);
  }
  scenes.push({ name:'PLASMA', draw(T,t){
    const p = (t%24) < 12 ? P : P2;
    const s1=Math.sin(t*0.31)*0.05+0.09, s2=Math.cos(t*0.23)*0.04+0.10;
    for (let y=0,i=0;y<H;y++){
      const sy = Math.sin(y*s2 - t*1.3);
      for (let x=0;x<W;x++,i++){
        const v = Math.sin(x*s1 + t*1.7)
                + sy
                + Math.sin((x+y)*0.055 + t*0.9)
                + Math.sin(dist[i]*0.14 - t*2.1)
                + Math.sin(dist2[i]*0.09 + t*1.1);
        let idx = ((v+5)*(64/10) + t*14)|0;
        T[i] = p[idx & 63];
      }
    }
  }});
}

/* 2. TUNNEL -------------------------------------------------------------- */
{
  const P = pal(32, [.5,.35,.2],[.5,.35,.25],[1,1,1],[0,.15,.25]);
  const dep = new Float32Array(W*H), ang = new Float32Array(W*H), fog = new Float32Array(W*H);
  for (let y=0,i=0;y<H;y++) for (let x=0;x<W;x++,i++){
    const dx=(x-W*0.5), dy=(y-H*0.5)*1.15;
    const d=Math.sqrt(dx*dx+dy*dy)+0.0001;
    dep[i] = 900/d;
    ang[i] = (Math.atan2(dy,dx)/TAU)*64;
    fog[i] = clamp(d/95, 0, 1);
  }
  scenes.push({ name:'TUNNEL', draw(T,t){
    const zo = t*46, ao = t*7 + Math.sin(t*0.6)*14;
    for (let i=0;i<W*H;i++){
      const u = (dep[i]+zo)|0, v = (ang[i]+ao)|0;
      const chk = ((u>>3) ^ (v>>2)) & 1;
      let l = (dep[i]*0.008 + zo*0.02);
      let shade = fog[i]*fog[i];
      let b = (chk ? 0.95 : 0.42) * (0.25 + shade*0.9);
      b += Math.sin(u*0.25)*0.06;
      T[i] = P[clamp((b*31)|0,0,31)];
    }
  }});
}

/* 3. HYPERSPACE ---------------------------------------------------------- */
{
  const N = 460;
  const sx = new Float32Array(N), sy = new Float32Array(N), sz = new Float32Array(N);
  const respawn = i => { sx[i]=(Math.random()*2-1)*2.4; sy[i]=(Math.random()*2-1)*2.4; sz[i]=Math.random()*3+0.2; };
  for (let i=0;i<N;i++) respawn(i);
  scenes.push({
    name:'HYPERSPACE',
    reset(){ for(let i=0;i<N;i++) respawn(i); },
    draw(T,t,dt){
      // fade-to-black trails
      for (let i=0;i<W*H;i++){
        const c=T[i];
        const r=(c&255)*0.80|0, g=((c>>8)&255)*0.80|0, b=((c>>16)&255)*0.82|0;
        T[i]=rgb(r,g,b);
      }
      const spd = (1.1 + Math.sin(t*0.5)*0.85) * dt;
      const rot = t*0.35, cs=Math.cos(rot), sn=Math.sin(rot);
      for (let i=0;i<N;i++){
        sz[i]-=spd;
        if (sz[i]<0.08){ respawn(i); sz[i]=3.2; }
        const iz = 1/sz[i];
        const px = sx[i]*iz, py = sy[i]*iz;
        const x = (px*cs - py*sn)*70 + W*0.5;
        const y = (px*sn + py*cs)*70 + H*0.5;
        if (x<0||y<0||x>=W||y>=H) continue;
        const br = clamp(1.45 - sz[i]*0.42, 0, 1);
        const big = br>0.68;
        const r = (br*255)|0, g=(br*230)|0, b=(120+br*135)|0;
        const col = rgb(r,g,b);
        const xi=x|0, yi=y|0;
        T[yi*W+xi]=col;
        if (big){
          if (xi+1<W) T[yi*W+xi+1]=col;
          if (yi+1<H){ T[(yi+1)*W+xi]=col; if(xi+1<W) T[(yi+1)*W+xi+1]=col; }
        }
      }
    }
  });
}

/* 4. METABALLS ----------------------------------------------------------- */
{
  const P = stops(48, [[0,[3,6,28]],[0.30,[8,40,86]],[0.52,[16,140,96]],[0.72,[70,235,90]],[0.88,[240,255,90]],[1,[255,255,240]]]);
  const NB = 6;
  scenes.push({ name:'BLOBS', draw(T,t){
    const bx=[],by=[],br=[];
    for (let k=0;k<NB;k++){
      bx[k]= W*0.5 + Math.sin(t*(0.6+k*0.17)+k*2.1)*(W*0.30);
      by[k]= H*0.5 + Math.cos(t*(0.5+k*0.21)+k*1.3)*(H*0.30);
      br[k]= 520 + Math.sin(t*1.3+k)*230;
    }
    for (let y=0,i=0;y<H;y++) for (let x=0;x<W;x++,i++){
      let s=0;
      for (let k=0;k<NB;k++){
        const dx=x-bx[k], dy=(y-by[k])*1.1;
        s += br[k]/(dx*dx+dy*dy+18);
      }
      const v = s*7.5 + bay(x,y)*0.12;
      T[i] = P[(v|0) % 48];
    }
  }});
}

/* 5. FIRE ---------------------------------------------------------------- */
{
  const P = stops(64, [[0,[0,0,0]],[0.12,[40,0,8]],[0.30,[150,16,4]],[0.52,[236,84,6]],[0.74,[255,180,20]],[0.90,[255,240,120]],[1,[255,255,250]]]);
  const FW = 100, FH = 75;                     // half-res => chunkier flames
  const heat = new Uint8Array(FW*(FH+2));
  let mask = null, mx=0, my=0;
  const words = ['CRT','1994','HELLO','PIXELS','SCANLINE'];
  scenes.push({
    name:'FIRE',
    reset(){
      heat.fill(0);
      const w = words[(Math.random()*words.length)|0];
      mask = textMask(w, 17);
      mx = (FW - mask.w) >> 1; my = (FH*0.44)|0;
    },
    draw(T,t){
      if(!mask) this.reset();
      // seed the bottom rows
      for (let y=FH;y<FH+2;y++){
        const row=y*FW;
        for (let x=0;x<FW;x++) heat[row+x] = Math.random()<0.94 ? 255 : 170;
      }
      // seed the burning word
      const pulse = 0.5+0.5*Math.sin(t*2.1);
      for (let y=0;y<mask.h;y++) for (let x=0;x<mask.w;x++){
        if (!mask.a[y*mask.w+x]) continue;
        const px=mx+x, py=my+y;
        if (px<0||px>=FW||py<0||py>=FH) continue;
        heat[py*FW+px] = 235 + (pulse*20)|0;
      }
      // propagate upward with decay + wander
      for (let y=0;y<FH+1;y++){
        const row=y*FW, below=(y+1)*FW;
        for (let x=0;x<FW;x++){
          const r = Math.random();
          const sx = r<0.22 ? x-1 : r<0.44 ? x+1 : x;
          const src = below + (sx<0?0:sx>=FW?FW-1:sx);
          const v = heat[src] - ((Math.random()*21)|0);
          heat[row+x] = v<0?0:v;
        }
      }
      for (let y=0;y<FH;y++){
        const o=(y*2)*W;
        for (let x=0;x<FW;x++){
          const c=P[(heat[y*FW+x]>>2)&63];
          const i=o+x*2;
          T[i]=c; T[i+1]=c; T[i+W]=c; T[i+W+1]=c;
        }
      }
    }
  });
}

/* 6. RAYMARCH BLOB (half-res, dithered) ---------------------------------- */
{
  const RW=100, RH=75;
  const P = stops(16, [[0,[6,3,18]],[0.22,[26,10,54]],[0.45,[92,24,110]],[0.66,[205,52,124]],[0.85,[255,150,60]],[1,[255,250,225]]]);
  const smin=(a,b,k)=>{ const h=clamp(0.5+0.5*(b-a)/k,0,1); return b*(1-h)+a*h - k*h*(1-h); };
  function map(x,y,z,t){
    // rotate
    const c1=Math.cos(t*0.7), s1=Math.sin(t*0.7);
    let X=x*c1 - z*s1, Z=x*s1 + z*c1;
    const c2=Math.cos(t*0.43), s2=Math.sin(t*0.43);
    let Y=y*c2 - Z*s2; Z=y*s2 + Z*c2;
    // torus
    const q = Math.sqrt(X*X + Z*Z) - 0.95;
    const tor = Math.sqrt(q*q + Y*Y) - 0.30;
    // pulsing sphere
    const sr = 0.55 + Math.sin(t*1.7)*0.22;
    const sp = Math.sqrt(x*x+y*y+z*z) - sr;
    return smin(tor, sp, 0.45);
  }
  scenes.push({ name:'BLOBJECT', draw(T,t){
    const ro_z = -3.0;
    for (let py=0;py<RH;py++){
      const uy = (py - RH*0.5)/RH * 1.5;
      for (let px=0;px<RW;px++){
        const ux = (px - RW*0.5)/RH * 1.5;
        let rl = 1/Math.sqrt(ux*ux+uy*uy+1);
        const dx=ux*rl, dy=uy*rl, dz=1*rl;
        let d=0, hit=0;
        for (let s=0;s<42;s++){
          const cxp=dx*d, cyp=dy*d, czp=ro_z+dz*d;
          const m=map(cxp,cyp,czp,t);
          if (m<0.006){ hit=1; break; }
          d+=m*0.9;
          if (d>7) break;
        }
        let col;
        if (hit){
          const X=dx*d, Y=dy*d, Z=ro_z+dz*d, e=0.02;
          const nx=map(X+e,Y,Z,t)-map(X-e,Y,Z,t);
          const ny=map(X,Y+e,Z,t)-map(X,Y-e,Z,t);
          const nz=map(X,Y,Z+e,t)-map(X,Y,Z-e,t);
          const nl=1/(Math.sqrt(nx*nx+ny*ny+nz*nz)+1e-6);
          const lx=0.577,ly=0.577,lz=-0.577;
          let dif = (nx*lx+ny*ly+nz*lz)*nl;
          dif = clamp(dif,0,1);
          const rim = 1 - clamp(-(nz*nl),0,1);
          let v = 0.10 + dif*dif*0.55 + dif*0.45 + rim*rim*0.45;
          v = v*15.5 + (bay(px,py)/64 - 0.5)*1.3;
          col = P[clamp(v|0,0,15)];
        } else {
          const bgv = 0.4 + (Math.sin(px*0.11 + py*0.06 + t*0.8)*0.5+0.5)*1.9 + (bay(px,py)/64-0.5)*1.0;
          col = P[clamp(bgv|0,0,15)];
        }
        const o=(py*2)*W + px*2;
        T[o]=col; T[o+1]=col; T[o+W]=col; T[o+W+1]=col;
      }
    }
  }});
}

/* 7. GRID / SUN ---------------------------------------------------------- */
{
  const HOR = 64;
  const stars = [];
  for (let i=0;i<80;i++) stars.push([ (Math.random()*W)|0, (Math.random()*(HOR-8))|0, Math.random() ]);
  const SKY = stops(HOR, [[0,[8,2,34]],[0.45,[64,8,80]],[0.75,[178,26,110]],[1,[255,86,120]]]);
  scenes.push({ name:'GRID', draw(T,t){
    // sky
    for (let y=0;y<HOR;y++){
      const c=SKY[y]; const row=y*W;
      for (let x=0;x<W;x++) T[row+x]=c;
    }
    // stars
    for (let i=0;i<stars.length;i++){
      const s=stars[i];
      const tw = 0.5+0.5*Math.sin(t*2.6+s[2]*9);
      if (tw>0.55){ const v=(140+tw*115)|0; T[s[1]*W+s[0]]=rgb(v,v,255); }
    }
    // sun (setting, sliced by widening gaps toward the horizon)
    const cxs=(W*0.5)|0, cys=HOR+2, R=38;
    for (let y=-R;y<=R;y++){
      const py=cys+y; if(py<0||py>=HOR) continue;
      const rel=(y+R)/(2*R);                      // 0 top .. 1 bottom
      const gapW = 1 + rel*rel*9;                 // gaps grow downward
      const per = 11;
      if (((y+R+120) % per) < gapW) continue;
      const half=Math.sqrt(Math.max(0,R*R-y*y))|0;
      const c = rgb(255, (44+rel*180)|0, (150-rel*110)|0);
      const row=py*W;
      for (let x=-half;x<=half;x++){
        const px=cxs+x; if(px<0||px>=W) continue;
        T[row+px]=c;
      }
    }
    // ground grid
    const scroll = t*0.9;
    const D = 40;
    for (let y=HOR;y<H;y++){
      const yy = y - HOR + 1;
      const z  = D/yy;              // depth: large at horizon, small up close
      const dz = z/yy;              // |dz/dy|
      const fade = clamp(1.05 - z*0.075, 0, 1);
      // horizontal (constant-z) lines
      const u  = z*5 + scroll;
      const fu = u - Math.floor(u);
      const du = fu<0.5?fu:1-fu;
      const wu = dz*5;
      const lz = (du < wu*0.55) ? clamp(1 - wu*1.1, 0, 1) * clamp((0.20-wu)/0.07, 0, 1) : 0;
      // vertical lines
      const sxr = z/12;
      const wx  = sxr*0.55;
      const kx  = clamp(1 - sxr*1.1, 0, 1) * clamp((0.20-sxr)/0.07, 0, 1);
      const row = y*W;
      const g   = fade*fade;
      const baseR=(10+26*g)|0, baseG=(2+6*g)|0, baseB=(26+56*g)|0;
      const base = rgb(baseR,baseG,baseB);
      for (let x=0;x<W;x++){
        const v  = (x - W*0.5) * sxr;
        const fv = v - Math.floor(v);
        const dv = fv<0.5?fv:1-fv;
        const lx = (dv < wx) ? kx : 0;
        if (lx<=0 && lz<=0){ T[row+x]=base; continue; }
        let r,g2,b;
        if (lz >= lx){ const i=lz*fade; r=(baseR+(90-baseR)*i)|0; g2=(baseG+(250-baseG)*i)|0; b=(baseB+(240-baseB)*i)|0; }
        else         { const i=lx*fade; r=(baseR+(255-baseR)*i)|0; g2=(baseG+(60-baseG)*i)|0; b=(baseB+(225-baseB)*i)|0; }
        T[row+x]=rgb(r,g2,b);
      }
    }
  }});
}

/* ROTOZOOM ---------------------------------------------------------------- */
{
  const TS=64, tex=new Uint32Array(TS*TS);
  const P=stops(16,[[0,[10,4,40]],[0.35,[120,20,140]],[0.62,[255,60,120]],[0.82,[255,190,60]],[1,[255,255,230]]]);
  for(let y=0;y<TS;y++)for(let x=0;x<TS;x++){
    const qx=(x&31)-15.5, qy=(y&31)-15.5;
    const d=Math.sqrt(qx*qx+qy*qy);
    const chk=((x>>5)^(y>>5))&1;
    let v = chk ? 14-d*0.62 : 2+d*0.42;
    if(Math.abs(d-11.5)<1.6) v = chk?3:15;
    if(d<3.2) v = chk?15:1;
    tex[y*TS+x]=P[clamp(v|0,0,15)];
  }
  scenes.push({name:'ROTOZOOM',draw(T,t){
    const z=1.15+Math.sin(t*0.5)*0.62, a=t*0.6;
    const ca=Math.cos(a)*z, sa=Math.sin(a)*z;
    const ox=Math.sin(t*0.31)*120+t*18, oy=Math.cos(t*0.27)*120+t*11;
    for(let y=0,i=0;y<H;y++){
      const dy=y-H*0.5;
      let u=(-W*0.5)*ca - dy*sa + ox;
      let v=(-W*0.5)*sa + dy*ca + oy;
      for(let x=0;x<W;x++,i++){
        T[i]=tex[(((v|0)&63)<<6)|((u|0)&63)];
        u+=ca; v+=sa;
      }
    }
  }});
}

/* BUMP MAPPING ------------------------------------------------------------ */
{
  const gx=new Float32Array(W*H), gy=new Float32Array(W*H);
  const hgt=(x,y)=>{
    const dx=x-W*0.5, dy=y-H*0.5;
    return Math.sin(x*0.36)*2.6 + Math.cos(y*0.36)*2.6
         + Math.sin((x+y)*0.10)*4.5
         + Math.sin(Math.sqrt(dx*dx+dy*dy)*0.20)*6;
  };
  for(let y=0,i=0;y<H;y++)for(let x=0;x<W;x++,i++){
    gx[i]=(hgt(x+1,y)-hgt(x-1,y))*0.5;
    gy[i]=(hgt(x,y+1)-hgt(x,y-1))*0.5;
  }
  scenes.push({name:'BUMPMAP',draw(T,t){
    const l1x=W*0.5+Math.sin(t*1.1)*W*0.42, l1y=H*0.5+Math.cos(t*0.9)*H*0.42;
    const l2x=W*0.5+Math.sin(t*0.7+2.2)*W*0.42, l2y=H*0.5+Math.cos(t*1.3+1.1)*H*0.42;
    for(let y=0,i=0;y<H;y++)for(let x=0;x<W;x++,i++){
      let dx=l1x-x, dy=l1y-y;
      let d2=dx*dx+dy*dy+1, inv=1/Math.sqrt(d2);
      let att=clamp(1-d2/34000,0,1);
      let a=clamp(0.12+(gx[i]*dx+gy[i]*dy)*inv*0.55,0,1)*att;
      dx=l2x-x; dy=l2y-y;
      d2=dx*dx+dy*dy+1; inv=1/Math.sqrt(d2);
      att=clamp(1-d2/12000,0,1);
      let b=clamp(0.12+(gx[i]*dx+gy[i]*dy)*inv*0.55,0,1)*att;
      a*=a; b*=b;
      T[i]=rgb(clamp(a*300+b*40,0,255)|0, clamp(a*120+b*170,0,255)|0, clamp(a*40+b*300,0,255)|0);
    }
  }});
}

/* VOXEL LANDSCAPE --------------------------------------------------------- */
{
  const MS=256, MM=MS-1;
  const hmap=new Float32Array(MS*MS), cmap=new Uint32Array(MS*MS);
  const CP=stops(64,[[0,[10,24,74]],[0.30,[20,64,126]],[0.38,[196,186,124]],[0.48,[38,110,52]],[0.70,[96,152,62]],[0.84,[112,102,94]],[0.93,[190,190,190]],[1,[255,255,255]]]);
  for(let y=0;y<MS;y++)for(let x=0;x<MS;x++){
    let h=fbm(x*0.030,y*0.030,5)*1.7-0.25;
    h=clamp(h,0,1); h=Math.pow(h,1.25);
    hmap[y*MS+x]=h*90;
    cmap[y*MS+x]=CP[clamp((h*63)|0,0,63)];
  }
  const ybuf=new Int16Array(W);
  const SKY=stops(90,[[0,[6,4,30]],[0.55,[70,26,90]],[0.8,[210,80,90]],[1,[255,170,90]]]);
  scenes.push({name:'VOXEL',draw(T,t){
    const hor=52;
    for(let y=0;y<H;y++){
      const c = y<hor+38 ? SKY[clamp((y/(hor+38)*89)|0,0,89)] : SKY[89];
      T.fill(c,y*W,y*W+W);
    }
    const cx=t*9, cy=t*17;
    const a=Math.sin(t*0.16)*0.6;
    const sn=Math.sin(a), cs=Math.cos(a);
    const camh=hmap[((cy|0)&MM)*MS+((cx|0)&MM)]+42;
    ybuf.fill(H);
    const ZFAR=190;
    let dz=0.4;
    for(let z=2.0; z<ZFAR; z+=dz){
      let plx = (-cs*z - sn*z), ply = ( sn*z - cs*z);
      const prx = ( cs*z - sn*z), pry = (-sn*z - cs*z);
      const stx=(prx-plx)/W, sty=(pry-ply)/W;
      plx+=cx; ply+=cy;
      const inv=1/z, fog=clamp(z/ZFAR,0,1), fg=1-fog*fog;
      const skyc=SKY[89];
      const sr=skyc&255, sg=(skyc>>8)&255, sb=(skyc>>16)&255;
      for(let x=0;x<W;x++){
        const mi=(((ply|0)&MM)*MS)+((plx|0)&MM);
        let hy=((camh-hmap[mi])*inv*95+hor)|0;
        if(hy<ybuf[x]){
          const c=cmap[mi];
          const col=rgb((((c&255)*fg+sr*(1-fg))|0),((((c>>8)&255)*fg+sg*(1-fg))|0),((((c>>16)&255)*fg+sb*(1-fg))|0));
          let y0=hy<0?0:hy;
          const y1=ybuf[x];
          for(let y=y0;y<y1;y++) T[y*W+x]=col;
          ybuf[x]=hy;
        }
        plx+=stx; ply+=sty;
      }
      dz+=0.012;
    }
  }});
}

/* FLAT SHADED SOLID ------------------------------------------------------- */
{
  const LAT=11, LON=18;
  const P=stops(24,[[0,[8,4,26]],[0.3,[40,16,86]],[0.6,[190,40,120]],[0.82,[255,150,50]],[1,[255,250,220]]]);
  const faces=[];
  for(let i=0;i<LAT;i++)for(let j=0;j<LON;j++) faces.push([i,j]);
  const zs=new Float32Array(faces.length), order=new Int32Array(faces.length);
  scenes.push({name:'SOLID',draw(T,t){
    vgrad(T,[4,2,14],[22,8,40]);
    const ca=Math.cos(t*0.7),sa=Math.sin(t*0.7),cb=Math.cos(t*0.45),sb=Math.sin(t*0.45);
    const pt=(i,j)=>{
      const th=i/LAT*Math.PI, ph=j/LON*6.2831853;
      const rr=1+0.30*Math.sin(th*4+t*2.2)*Math.sin(ph*3-t*1.7);
      let x=Math.sin(th)*Math.cos(ph)*rr, y=Math.cos(th)*rr, z=Math.sin(th)*Math.sin(ph)*rr;
      let y2=y*ca-z*sa, z2=y*sa+z*ca;
      let x2=x*cb+z2*sb; z2=-x*sb+z2*cb;
      return [x2,y2,z2];
    };
    const cache=[];
    for(let i=0;i<=LAT;i++){ cache[i]=[]; for(let j=0;j<=LON;j++) cache[i][j]=pt(i,j%LON); }
    for(let f=0;f<faces.length;f++){
      const i=faces[f][0], j=faces[f][1];
      zs[f]=cache[i][j][2]+cache[i+1][j][2]+cache[i][j+1][2]+cache[i+1][j+1][2];
      order[f]=f;
    }
    const ord=Array.from(order).sort((a,b)=>zs[b]-zs[a]);
    const K=48, cxp=W*0.5, cyp=H*0.5;
    for(let n=0;n<ord.length;n++){
      const f=ord[n], i=faces[f][0], j=faces[f][1];
      const a=cache[i][j], b=cache[i+1][j], c=cache[i+1][j+1], d=cache[i][j+1];
      const ux=b[0]-a[0], uy=b[1]-a[1], uz=b[2]-a[2];
      const vx=d[0]-a[0], vy=d[1]-a[1], vz=d[2]-a[2];
      let nx=uy*vz-uz*vy, ny=uz*vx-ux*vz, nz=ux*vy-uy*vx;
      const nl=Math.sqrt(nx*nx+ny*ny+nz*nz)+1e-6;
      nx/=nl; ny/=nl; nz/=nl;
      if(nz<0) continue;
      let dif=clamp(nx*0.5+ny*0.6+nz*0.62,0,1);
      const col=P[clamp((dif*dif*20+3)|0,0,23)];
      const pr=p=>[cxp+p[0]*K/(1+p[2]*0.16), cyp+p[1]*K/(1+p[2]*0.16)];
      const A2=pr(a),B2=pr(b),C2=pr(c),D2=pr(d);
      tri(T,A2[0],A2[1],B2[0],B2[1],C2[0],C2[1],col);
      tri(T,A2[0],A2[1],C2[0],C2[1],D2[0],D2[1],col);
    }
  }});
}

/* VECTOR BALLS (BOBS) ----------------------------------------------------- */
{
  const N=200, SR=4;
  const SS=SR*2+1;
  const spr=new Float32Array(SS*SS);
  for(let y=0;y<SS;y++)for(let x=0;x<SS;x++){
    const dx=x-SR, dy=y-SR, d=Math.sqrt(dx*dx+dy*dy)/SR;
    spr[y*SS+x]=clamp(1-d*d,0,1);
  }
  const sh=[];
  for(let i=0;i<N;i++){
    const gi=i/N;
    // sphere
    const th=Math.acos(1-2*(i+0.5)/N), ph=i*2.399963;
    const s=[Math.sin(th)*Math.cos(ph),Math.cos(th),Math.sin(th)*Math.sin(ph)];
    // torus
    const a=gi*6.2831853*5, b2=gi*6.2831853;
    const tr=[(0.72+0.30*Math.cos(a))*Math.cos(b2),0.30*Math.sin(a),(0.72+0.30*Math.cos(a))*Math.sin(b2)];
    // cube shell
    const k=i%6, m=(i/6)|0, u=(m%6)/2.5-1, v=(((m/6)|0)%6)/2.5-1;
    const cu=[[1,u,v],[-1,u,v],[u,1,v],[u,-1,v],[u,v,1],[u,v,-1]][k];
    sh.push([s,tr,cu]);
  }
  const zi=new Float32Array(N), idx=new Int32Array(N);
  scenes.push({name:'BOBS',draw(T,t){
    vgrad(T,[2,2,10],[16,4,30]);
    const ph=(t*0.26)%3, m=ph|0, f=ph-m, m2=(m+1)%3;
    const fr=clamp((f-0.62)/0.38,0,1), ease=fr*fr*(3-2*fr);

/* RAYCAST CORRIDOR -------------------------------------------------------- */
{
  const MS=16;
  const map=new Uint8Array(MS*MS);
  for(let y=0;y<MS;y++)for(let x=0;x<MS;x++){
    map[y*MS+x]=(x===0||y===0||x===MS-1||y===MS-1)?1:((x%3===1&&y%3===1)?2:0);
  }
  const TXW=32, tx1=new Uint32Array(TXW*TXW), tx2=new Uint32Array(TXW*TXW);
  const P1=stops(8,[[0,[40,10,10]],[0.5,[180,60,40]],[1,[255,200,150]]]);
  const P2=stops(8,[[0,[10,20,40]],[0.5,[40,120,180]],[1,[190,240,255]]]);
  for(let y=0;y<TXW;y++)for(let x=0;x<TXW;x++){
    const brick=((y>>2)&1)? ((x+4)>>3)&1 : (x>>3)&1;
    const e=(y&3)===0||((x+(((y>>2)&1)?4:0))&7)===0;
    tx1[y*TXW+x]=P1[e?1:(brick?6:4)];
    tx2[y*TXW+x]=P2[((x^y)&7)];
  }
  scenes.push({name:'RAYCAST',draw(T,t){
    for(let y=0;y<H;y++){
      const c = y<H*0.5 ? rgb(6+((H*0.5-y)*0.05)|0,4,18+((H*0.5-y)*0.12)|0) : rgb(20,14,10);
      T.fill(c,y*W,y*W+W);
    }
    const px=8+Math.sin(t*0.35)*4.2, py=8+Math.cos(t*0.27)*4.2;
    const ang=t*0.42;
    const dirx=Math.cos(ang), diry=Math.sin(ang);
    const plx=-diry*0.66, ply=dirx*0.66;
    for(let x=0;x<W;x++){
      const cam=2*x/W-1;
      const rdx=dirx+plx*cam, rdy=diry+ply*cam;
      let mx=px|0, my=py|0;
      const ddx=Math.abs(1/(rdx||1e-9)), ddy=Math.abs(1/(rdy||1e-9));
      let stepx,stepy,sdx,sdy;
      if(rdx<0){stepx=-1;sdx=(px-mx)*ddx;}else{stepx=1;sdx=(mx+1-px)*ddx;}
      if(rdy<0){stepy=-1;sdy=(py-my)*ddy;}else{stepy=1;sdy=(my+1-py)*ddy;}
      let side=0,hit=0,n=0;
      while(!hit && n++<64){
        if(sdx<sdy){sdx+=ddx;mx+=stepx;side=0;}else{sdy+=ddy;my+=stepy;side=1;}
        if(mx<0||my<0||mx>=MS||my>=MS)break;
        if(map[my*MS+mx])hit=map[my*MS+mx];
      }
      if(!hit)continue;
      const dist=side===0?(sdx-ddx):(sdy-ddy);
      const lh=(H*1.55/(dist+0.0001))|0;
      let y0=((H-lh)>>1), y1=y0+lh;
      let wall = side===0 ? py+dist*rdy : px+dist*rdx;
      wall-=Math.floor(wall);
      let txX=(wall*TXW)|0;
      if((side===0&&rdx>0)||(side===1&&rdy<0)) txX=TXW-txX-1;
      const tex=hit===1?tx1:tx2;
      const shade=clamp(1.25-dist*0.13,0.12,1)*(side?0.68:1);
      const step=TXW/lh;
      let tp=(y0<0?-y0:0)*step;
      const a0=Math.max(0,y0), a1=Math.min(H-1,y1);
      for(let y=a0;y<=a1;y++){
        const c=tex[(((tp|0)&(TXW-1))*TXW)|txX];
        tp+=step;
        T[y*W+x]=rgb(((c&255)*shade)|0,(((c>>8)&255)*shade)|0,(((c>>16)&255)*shade)|0);
      }
      // floor shading
      for(let y=a1+1;y<H;y++){
        const f=clamp((y-H*0.5)/(H*0.5),0,1);
        const v=(f*70)|0;
        T[y*W+x]=rgb(14+v,10+((v*0.7)|0),8+((v*0.5)|0));
      }
    }
  }});
}

/* INFINITE LATTICE (raymarched flythrough) -------------------------------- */
{

  const RAD=0.34, CELL=3.0;
  function de(x,y,z){
    const qx=((x%CELL)+CELL)%CELL-CELL*0.5;
    const qy=((y%CELL)+CELL)%CELL-CELL*0.5;
    const qz=((z%CELL)+CELL)%CELL-CELL*0.5;
    const a=Math.sqrt(qy*qy+qz*qz)-RAD;
    const b=Math.sqrt(qx*qx+qz*qz)-RAD;
    const c=Math.sqrt(qx*qx+qy*qy)-RAD;
    let d=a<b?a:b; if(c<d)d=c;
    const s=Math.sqrt(qx*qx+qy*qy+qz*qz)-RAD*1.9;
    return s<d?s:d;
  }

    const cz=t*2.6, cx=Math.sin(t*0.31)*1.1, cy=Math.cos(t*0.24)*1.1;

        const vx0=(px-RW*0.5)/RH*1.15;
        const vx=vx0*cr-vy0*sr, vy=vx0*sr+vy0*cr;
        let dx=vx*cy2+1*sy2, dy=vy, dz=-vx*sy2+1*cy2;
        const l=1/Math.sqrt(dx*dx+dy*dy+dz*dz); dx*=l;dy*=l;dz*=l;
        let d=0,s=0,hit=0;
        for(s=0;s<70;s++){

          if(m<0.004){hit=1;break;}
          d+=m*0.95;
          if(d>17)break;

        if(hit){
          const e=0.01, X=cx+dx*d, Y=cy+dy*d, Z=cz+dz*d;
          const nx=de(X+e,Y,Z)-de(X-e,Y,Z), ny=de(X,Y+e,Z)-de(X,Y-e,Z), nz=de(X,Y,Z+e)-de(X,Y,Z-e);
          const nl=1/(Math.sqrt(nx*nx+ny*ny+nz*nz)+1e-9);
          const dif=clamp((nx*0.45+ny*0.62+nz*-0.65)*nl,0,1);
          const fog=clamp(1-d/15,0,1);
          let v=(0.10+dif*0.95)*fog*fog*15.6;
          v+=(bay(px,py)/64-0.5)*1.1;
          col=P[clamp(v|0,0,15)];
        } else {
          col=P[clamp((0.3+(bay(px,py)/64-0.5)*0.9)|0,0,15)];
        }
        const o=(py*2)*W+px*2;
        T[o]=col;T[o+1]=col;T[o+W]=col;T[o+W+1]=col;
      }
    }
  }});
}

/* SHADEBOBS --------------------------------------------------------------- */
{
  const acc=new Float32Array(W*H);
  const P=stops(64,[[0,[0,0,10]],[0.18,[60,0,90]],[0.38,[190,20,120]],[0.58,[255,110,40]],[0.76,[255,220,80]],[0.9,[190,255,220]],[1,[255,255,255]]]);
  const BR=9, BS=BR*2+1, kern=new Float32Array(BS*BS);
  for(let y=0;y<BS;y++)for(let x=0;x<BS;x++){
    const dx=(x-BR)/BR, dy=(y-BR)/BR, d=dx*dx+dy*dy;
    kern[y*BS+x]=d>1?0:(1-d)*(1-d)*7;
  }
  scenes.push({name:'SHADEBOBS',
    reset(){ acc.fill(0); },
    draw(T,t){
      for(let i=0;i<W*H;i++) acc[i]*=0.955;
      for(let k=0;k<9;k++){
        const p=t*1.2+k*0.7;
        const bx=(W*0.5+Math.sin(p*0.9+k)*Math.cos(p*0.31)*(W*0.40))|0;
        const by=(H*0.5+Math.cos(p*1.1+k*1.3)*Math.sin(p*0.27)*(H*0.40))|0;
        for(let y=0;y<BS;y++){
          const py=by+y-BR; if(py<0||py>=H)continue;
          const row=py*W;
          for(let x=0;x<BS;x++){
            const px=bx+x-BR; if(px<0||px>=W)continue;
            acc[row+px]+=kern[y*BS+x];
          }
        }
      }
      for(let i=0;i<W*H;i++){
        const v=acc[i];

{

/* RAYTRACED SPHERES ------------------------------------------------------- */
{
  scenes.push({name:'RAYTRACE',draw(T,t){
    const sp=[];
    for(let k=0;k<3;k++){
      const a=t*0.8+k*2.094;
      sp.push([Math.cos(a)*1.25, -0.35+Math.abs(Math.sin(t*1.6+k))*0.9, 3.6+Math.sin(a)*1.25, 0.62,
               [[255,70,90],[80,220,255],[255,210,70]][k]]);
    }
    const ox=0, oy=0.55, oz=-0.6;
    for(let y=0,i=0;y<H;y++){
      const uy=-((y-H*0.5)/H)*1.2;
      for(let x=0;x<W;x++,i++){
        let dx=((x-W*0.5)/H)*1.2, dy=uy, dz=1;
        const l=1/Math.sqrt(dx*dx+dy*dy+1); dx*=l;dy*=l;dz*=l;
        let r=0,g=0,b=0, bounce=0;
        let px=ox,py=oy,pz=oz;
        for(bounce=0;bounce<2;bounce++){
          let best=1e9, bi=-1;
          for(let k=0;k<3;k++){
            const s=sp[k];
            const ex=px-s[0], ey=py-s[1], ez=pz-s[2];
            const bq=ex*dx+ey*dy+ez*dz;
            const c=ex*ex+ey*ey+ez*ez-s[3]*s[3];
            const h=bq*bq-c;
            if(h<0)continue;
            const tt=-bq-Math.sqrt(h);
            if(tt>0.001&&tt<best){best=tt;bi=k;}
          }
          let tp=1e9;
          if(dy<-1e-6){ const tt=(-1.0-py)/dy; if(tt>0.001) tp=tt; }
          if(tp<best){
            const hx=px+dx*tp, hz=pz+dz*tp;
            const chk=(((Math.floor(hx*0.8)+Math.floor(hz*0.8))&1)===0);
            const fog=clamp(1-(hz-oz)*0.055,0,1);
            const base=chk?[210,215,225]:[26,30,52];
            r+=base[0]*fog*(bounce?0.35:1); g+=base[1]*fog*(bounce?0.35:1); b+=base[2]*fog*(bounce?0.35:1);
            break;
          } else if(bi>=0){
            const s=sp[bi];
            px=px+dx*best; py=py+dy*best; pz=pz+dz*best;
            let nx=(px-s[0])/s[3], ny=(py-s[1])/s[3], nz=(pz-s[2])/s[3];
            const dif=clamp(nx*0.4+ny*0.82+nz*-0.4,0,1);
            const spec=Math.pow(dif,18);
            const w=bounce?0.35:0.62;
            r+=(s[4][0]*(0.18+dif*0.9)+spec*220)*w;
            g+=(s[4][1]*(0.18+dif*0.9)+spec*220)*w;
            b+=(s[4][2]*(0.18+dif*0.9)+spec*220)*w;
            const dot=dx*nx+dy*ny+dz*nz;
            dx-=2*dot*nx; dy-=2*dot*ny; dz-=2*dot*nz;
            px+=dx*0.002; py+=dy*0.002; pz+=dz*0.002;
          } else {
            const sky=clamp(0.5+dy*1.2,0,1);
            r+=(20+sky*90)*(bounce?0.35:1); g+=(10+sky*40)*(bounce?0.35:1); b+=(46+sky*150)*(bounce?0.35:1);
            break;
          }
        }
        T[i]=rgb(clamp(r,0,255)|0,clamp(g,0,255)|0,clamp(b,0,255)|0);
      }
    }
  }});
}

{

  const respawn=i=>{sx[i]=(Math.random()*2-1)*2.2;sy[i]=(Math.random()*2-1)*2.2;sz[i]=Math.random()*3+0.2;};
  for(let i=0;i<N;i++) respawn(i);

    reset(){ if(!masks.length) for(const w of words) masks.push(textMask(w,26)); },

      }

      const m=masks[idx];
      const pop=f<0.16?(f/0.16):(f>0.9?(1-f)/0.1:1);

/* VHS GLITCH -------------------------------------------------------------- */
{
  const srcb=new Uint32Array(W*H);
  const bars=[[192,192,192],[192,192,0],[0,192,192],[0,192,0],[192,0,192],[192,0,0],[0,0,192]];
  let stamp=null;
  scenes.push({name:'VHS',
    reset(){ stamp=textMask('SP  0:14:23',11); },
    draw(T,t){
      if(!stamp)this.reset();
      // source frame: colour bars + orbiting blob + timestamp
      for(let y=0;y<H;y++){
        const row=y*W;
        for(let x=0;x<W;x++){
          let c;
          if(y<H*0.62){ const b2=bars[(x*7/W)|0]; c=rgb(b2[0],b2[1],b2[2]); }
          else if(y<H*0.72){ const f=(x/W); c=rgb((f*255)|0,(f*255)|0,(f*255)|0); }
          else { c=rgb(14,14,26); }
          srcb[row+x]=c;
        }
      }
      for(let k=0;k<2;k++){
        const a=t*(1.1+k*0.6)+k*2;
        const cx=W*0.5+Math.cos(a)*60, cy=H*0.55+Math.sin(a*1.3)*40, r=15+k*6;
        const col=k?rgb(255,240,90):rgb(30,255,180);
        for(let y=-r;y<=r;y++)for(let x=-r;x<=r;x++){
          if(x*x+y*y>r*r)continue;
          const px=(cx+x)|0, py=(cy+y)|0;
          if(px<0||py<0||px>=W||py>=H)continue;
          srcb[py*W+px]=col;
        }
      }
      for(let y=0;y<stamp.h;y++)for(let x=0;x<stamp.w;x++){
        if(!stamp.a[y*stamp.w+x])continue;
        const px=8+x, py=H-16+y;
        if(px<W&&py<H&&py>=0) srcb[py*W+px]=0xffffffff;
      }
      // glitch pass
      const roll=((t*36)%(H+60))-30;
      for(let y=0;y<H;y++){
        let sh=(Math.sin(y*0.7+t*9)*1.4 + Math.sin(y*0.13+t*3)*2.2)|0;
        const dr=Math.abs(y-roll);
        if(dr<9){ sh += ((9-dr)*2.4*(Math.random()*2-1))|0; }
        if(Math.random()<0.012) sh += ((Math.random()*26)-13)|0;
        const rs=sh+2, bs=sh-2;
        const row=y*W;
        for(let x=0;x<W;x++){
          const cr=srcb[row+clamp(x-rs,0,W-1)];
          const cg=srcb[row+clamp(x-sh,0,W-1)];
          const cb=srcb[row+clamp(x-bs,0,W-1)];
          let r=cr&255, g=(cg>>8)&255, b=(cb>>16)&255;
          if(dr<9){ const f=1+(9-dr)*0.12; r=clamp(r*f,0,255); g=clamp(g*f,0,255); b=clamp(b*f,0,255); }
          const n=(Math.random()*26)|0;
          if(Math.random()<0.05){ r=clamp(r+n,0,255); g=clamp(g+n,0,255); b=clamp(b+n,0,255); }
          if((y&1)===0){ r*=0.86; g*=0.86; b*=0.86; }
          T[row+x]=rgb(r|0,g|0,b|0);
        }
      }
    }});
}

    const F=[[0,1,2,3],[5,4,7,6],[4,0,3,7],[1,5,6,2],[4,5,1,0],[3,2,6,7]];
    const ax=t*0.6, ay=t*0.9;
    const P=CUBE_V.map(v=>{ const r=rot3(v[0],v[1],v[2],ax,ay); return proj(r,4,190); });
    const order=F.map((f,i)=>[i,(P[f[0]][2]+P[f[1]][2]+P[f[2]][2]+P[f[3]][2])/4]).sort((a,b)=>b[1]-a[1]);
    for(const [fi] of order){
      const f=F[fi], A=P[f[0]],B=P[f[1]],C=P[f[2]],D=P[f[3]];
      const cr=(B[0]-A[0])*(C[1]-A[1])-(B[1]-A[1])*(C[0]-A[0]);
      if(cr<0)continue;
      const ymin=Math.max(0,Math.min(A[1],B[1],C[1],D[1])|0), ymax=Math.min(H-1,Math.max(A[1],B[1],C[1],D[1])|0);
      const pts=[A,B,C,D];
      for(let y=ymin;y<=ymax;y++){
        let lo=1e9,hi=-1e9,lu=0,hu=0;
        for(let i=0;i<4;i++){
          const p=pts[i],q=pts[(i+1)%4];
          if((p[1]<=y&&q[1]>y)||(q[1]<=y&&p[1]>y)){
            const f2=(y-p[1])/(q[1]-p[1]);
            const x=p[0]+(q[0]-p[0])*f2;
            const u=[0,1,1,0][i]+([1,1,0,0][i]-[0,1,1,0][i])*f2;
            if(x<lo){lo=x;lu=u;} if(x>hi){hi=x;hu=u;}
          } }
        if(hi<=lo)continue;
        for(let x=Math.max(0,lo|0);x<=Math.min(W-1,hi|0);x++){
          const u=lu+(hu-lu)*((x-lo)/(hi-lo));
          const v=(y-ymin)/Math.max(1,ymax-ymin);
          const chk=(((u*4)|0)^((v*4)|0))&1;
          T[y*W+x]= chk?rgb(240,200-fi*20,60+fi*30):rgb(40+fi*20,30,90+fi*22);
        }
      }
    }
  }});

  /* 23 star wars crawl */
  { let m=null;

    scenes.push({name:'CRAWL',tag:'misc',

  /* 24 matrix rain */
  { const cols=[]; let gl=null;

  /* 25 ascii art renderer */
  { let gl=null;
    scenes.push({name:'ASCIIART',tag:'misc',

          const gi=clamp(((v+1)*0.5*9)|0,0,9);

          for(let b=0;b<g.h;b++)for(let a=0;a<g.w;a++) if(g.a[b*g.w+a]) pset(T,x+a,y+b,c);

  /* 26 dither gradient showcase */
  scenes.push({name:'DITHERLAB',tag:'misc',draw(T,t){
    for(let y=0;y<H;y++)for(let x=0;x<W;x++){
      const v=clamp((x/W)*0.8+Math.sin(y*0.05+t)*0.1+0.1,0,1);
      const band=(y/(H/4))|0;
      let out;
      if(band===0) out=v>0.5?1:0;
      else if(band===1) out=(bay(x,y)/64<v)?1:0;

      else out=(Math.random()<v)?1:0;
      const c1=[rgb(255,240,180),rgb(120,255,220),rgb(255,120,180),rgb(160,180,255)][band];
      T[y*W+x]=out?c1:rgb(10,8,24);
    }

  /* 27 pixel sort glitch */
  scenes.push({name:'PIXELSORT',tag:'misc',draw(T,t){
    for(let y=0;y<H;y++)for(let x=0;x<W;x++){
      const v=Math.sin(x*0.05+t)+Math.sin(y*0.06-t*1.2)+Math.sin((x+y)*0.03+t*0.6);
      T[y*W+x]=rgb((128+120*Math.sin(v*2))|0,(128+120*Math.sin(v*2+2))|0,(128+120*Math.sin(v*2+4))|0);
    }
    const lum=c=>(c&255)*0.3+((c>>8)&255)*0.6+((c>>16)&255)*0.1;
    for(let y=0;y<H;y++){
      if(((y*7+((t*20)|0))%11)>5)continue;
      const start=((Math.sin(y*0.1+t)*0.5+0.5)*W*0.4)|0;
      const len=40+((y*13)%80);
      const row=y*W;
      const seg=[];
      for(let x=start;x<Math.min(W,start+len);x++) seg.push(T[row+x]);
      seg.sort((a,b)=>lum(a)-lum(b));
      for(let i=0;i<seg.length;i++) T[row+start+i]=seg[i];
    }
  }});

  /* 28 kaleidoscope */
  scenes.push({name:'KALEIDO',tag:'misc',draw(T,t){
    const N=6;
    for(let y=0;y<H;y++)for(let x=0;x<W;x++){
      const dx=x-W*0.5, dy=y-H*0.5;
      let a=Math.atan2(dy,dx), r=Math.sqrt(dx*dx+dy*dy);
      const seg=6.2832/N;
      a=((a%seg)+seg)%seg;
      if(a>seg*0.5)a=seg-a;
      a+=t*0.25;
      const u=Math.cos(a)*r, v=Math.sin(a)*r;
      const q=Math.sin(u*0.09+t)+Math.sin(v*0.11-t*1.3)+Math.sin((u+v)*0.05+t*0.6);
      T[y*W+x]=rgb((128+120*Math.sin(q*2))|0,(128+120*Math.sin(q*2+2.1))|0,(128+120*Math.sin(q*2+4.2))|0);
    }
  }});

  /* 29 mirrored tiles */
  scenes.push({name:'MIRRORTILE',tag:'misc',draw(T,t){
    const S=50;
    for(let y=0;y<H;y++)for(let x=0;x<W;x++){
      let u=x%S, v=y%S;
      if((((x/S)|0)&1)) u=S-1-u;
      if((((y/S)|0)&1)) v=S-1-v;
      const q=Math.sin(u*0.16+t*1.4)+Math.sin(v*0.14-t)+Math.sin((u*v)*0.006+t*0.5);
      T[y*W+x]=rgb((120+110*Math.sin(q*1.7))|0,(60+90*Math.sin(q*1.7+2))|0,(180+70*Math.sin(q*1.7+4))|0);
    }
  }});

  /* 30 crt test card */
  { let m=null;
    scenes.push({name:'TESTCARD',tag:'misc',reset(){m=textMask('CRT-256',12);},
      draw(T,t){ if(!m)this.reset();
        const BARS=[rgb(192,192,192),rgb(192,192,0),rgb(0,192,192),rgb(0,192,0),rgb(192,0,192),rgb(192,0,0),rgb(0,0,192)];
        for(let x=0;x<W;x++) vline(T,x,0,H*0.62,BARS[((x*7/W)|0)]);
        for(let x=0;x<W;x++) vline(T,x,H*0.62,H*0.72,rgb((x/W*255)|0,(x/W*255)|0,(x/W*255)|0));
        rect(T,0,H*0.72,W,H,rgb(20,20,20));
        for(let i=0;i<8;i++) rect(T,4+i*24,H*0.75,20,10,rgb(i*36,i*36,i*36));
        for(let i=0;i<20;i++) vline(T,4+i*4,H*0.88,H-4,rgb(255,255,255));
        for(let i=0;i<20;i++) vline(T,90+i*2,H*0.88,H-4,rgb(255,255,255));
        for(let i=0;i<26;i++) vline(T,136+i,H*0.88,H-4,(i&1)?rgb(255,255,255):rgb(0,0,0));
        ring(T,W*0.5,H*0.36,40,rgb(255,255,255)); ring(T,W*0.5,H*0.36,41,rgb(255,255,255));
        const lx=(W-m.w)>>1;
        for(let y=0;y<m.h;y++)for(let x=0;x<m.w;x++) if(m.a[y*m.w+x]) pset(T,lx+x,H*0.36-6+y,rgb(0,0,0));
      }});
  }

  /* 31 BIOS boot */
  { let m=null;
    const L=['CRT BIOS v2.56  (C) 1994','','Main Processor  : 6510 @ 1.02 MHz','Memory Test     : 65536K OK','Video Adapter   : 200x150 RGB','Fixed Disk 0    : NONE','','Detecting demo effects ... 256 found','','Booting from CRT0:'];
    scenes.push({name:'BIOSBOOT',tag:'misc',reset(){ if(!m) m=L.map(s=>textMask(s,8)); },
      draw(T,t){ if(!m)this.reset();
        T.fill(rgb(0,0,0));
        const n=clamp(((t*2.2)|0),0,L.length);
        for(let i=0;i<n;i++){ const k=m[i];
          for(let y=0;y<k.h;y++)for(let x=0;x<k.w;x++) if(k.a[y*k.w+x]) pset(T,8+x,10+i*12+y,rgb(190,190,190)); }
        if(((t*3)|0)&1&&n<=L.length) rect(T,8,10+n*12,5,8,rgb(190,190,190));
        rect(T,0,H-12,W,12,rgb(0,0,160));
      }});
  }

  /* 32 the end */
  { let m=null,m2=null;
    scenes.push({name:'THEEND',tag:'misc',reset(){m=textMask('THE END',34);m2=textMask('256 EFFECTS  -  0 DEPENDENCIES',9);},
      draw(T,t){ if(!m)this.reset();
        for(let y=0;y<H;y++) hline(T,0,W-1,y,rgb((y*0.3)|0,(y*0.1)|0,(20+y*0.5)|0));
        for(let i=0;i<70;i++){ const x=(i*67)%W, y=(i*41)%H;
          const b=(Math.sin(t*2+i)*0.5+0.5)*255; pset(T,x,y,rgb(b|0,b|0,255)); }
        const lx=(W-m.w)>>1, ly=(H*0.36)|0;
        for(let y=0;y<m.h;y++)for(let x=0;x<m.w;x++) if(m.a[y*m.w+x]){
          pset(T,lx+x+2,ly+y+2,rgb(20,0,30));
          pset(T,lx+x,ly+y,rgb(255,(220-y*2)|0,(120+x)%255)); }
        const lx2=(W-m2.w)>>1;
        for(let y=0;y<m2.h;y++)for(let x=0;x<m2.w;x++) if(m2.a[y*m2.w+x])
          pset(T,lx2+x,H*0.68+y,rgb(200,220,255));

}

// ---------------------------------------------------------------- running order
// interleave families round-robin so neighbouring parts never rhyme
{
  const TAGS=['core','c64','para','snes','d3','nes','auto','amiga','frac','misc','part'];
  const buckets=new Map();
  for(const s of scenes){ const k=s.tag||'core';
    if(!buckets.has(k)) buckets.set(k,[]); buckets.get(k).push(s); }
  const keys=TAGS.filter(k=>buckets.has(k)).concat([...buckets.keys()].filter(k=>TAGS.indexOf(k)<0));
  const out=[];
  let left=scenes.length, ki=0;
  while(left>0){
    const k=keys[ki%keys.length]; ki++;
    const b=buckets.get(k);
    if(b&&b.length){ out.push(b.shift()); left--; }
    else if(keys.every(q=>!buckets.get(q).length)) break;
  }
  scenes.length=0;
  for(const x of out) scenes.push(x);
}

// ---------------------------------------------------------------- sequencer
const LEN = 15.0, TRANS = 1.3;
let cur = 0, nxt = -1, curStart = 0, started = performance.now()/1000, last = started;
let hold = false;

function enter(i){ const s=scenes[i]; if (s.reset) s.reset(); }
enter(0);

function jump(i){
  cur = ((i % scenes.length) + scenes.length) % scenes.length;
  nxt = -1; curStart = now(); enter(cur);
  flash(scenes[cur].name);
}
function now(){ return performance.now()/1000 - started; }

function frame(){
  requestAnimationFrame(frame);
  const t = now();
  let dt = t - last; last = t;
  if (dt > 0.1) dt = 0.1;

  const local = t - curStart;
  const s = scenes[cur];
  s.draw(A, t, dt);

  if (!hold && local > LEN - TRANS){
    if (nxt < 0){ nxt = (cur+1) % scenes.length; enter(nxt); B.fill(0xff000000); }
    scenes[nxt].draw(B, t, dt);
    const p = (local - (LEN - TRANS)) / TRANS;
    const thr = p*p*(3-2*p) * 64;
    for (let y=0,i=0;y<H;y++) for (let x=0;x<W;x++,i++){
      if (bay(x,y) < thr) A[i] = B[i];
    }
  }
  if (!hold && local >= LEN){
    cur = nxt < 0 ? (cur+1)%scenes.length : nxt;
    nxt = -1; curStart = t;
    if (showNames) flash(scenes[cur].name);
  }

  drawFlash(A, t);

  ctx.putImageData(imgA, 0, 0);
}

// tiny scene-name flash
let flashText = null, flashT = -99, flashMask = null, showNames = true;
function flash(txt){ flashText = txt; flashT = now(); flashMask = textMask(txt, 12); }
function drawFlash(T, t){
  if (!flashMask || !showNames) return;
  const age = t - flashT;
  if (age > 2.2) return;
  const a = age < 1.6 ? 1 : (2.2-age)/0.6;
  if (((t*12)|0 & 1) && age > 1.6) return;
  const m = flashMask, ox = 6, oy = 6;
  const col = rgb((255*a)|0,(255*a)|0,(120*a)|0);
  for (let y=0;y<m.h;y++) for (let x=0;x<m.w;x++){
    if (!m.a[y*m.w+x]) continue;
    const px=ox+x, py=oy+y;
    if (px<W&&py<H) T[py*W+px]=col;
  }
}

// ---------------------------------------------------------------- layout
function fit(){
  const vw = window.innerWidth, vh = window.innerHeight;
  let s = Math.min(vw/W, vh/H);
  s = Math.max(1, Math.floor(s));            // integer scale = perfect square pixels
  // if integer scaling wastes a lot, allow a half step (still nearest-neighbour)
  const fs = Math.min(vw/W, vh/H);
  if (fs - s > 0.5) s += 0.5;
  cv.style.width  = (W*s) + 'px';
  cv.style.height = (H*s) + 'px';
}
window.addEventListener('resize', fit);
fit();

// ---------------------------------------------------------------- input
const hud = document.getElementById('hud');
let hudT = 0;
function showHud(){ hud.classList.add('on'); clearTimeout(hudT); hudT=setTimeout(()=>hud.classList.remove('on'), 2500); }
showHud();

addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === ' ' ){ e.preventDefault(); jump(cur+1); }
  else if (k >= '1' && k <= '9'){ const i = +k - 1; if (i < scenes.length) jump(i); }
  else if (k === 'f'){ if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); }
  else if (k === 'h'){ showHud(); }
  else if (k === 'n'){ showNames = !showNames; }
  else if (k === 'r'){ jump((Math.random()*scenes.length)|0); }
  else if (k === 'p'){ hold = !hold; flash(hold?'HOLD':'AUTO'); }
  else if (k === 'arrowleft'){ jump(cur-1); }
  else if (k === 'arrowright'){ jump(cur+1); }
});
addEventListener('click', () => jump(cur+1));
addEventListener('mousemove', showHud);

window.__demo = { jump, scenes, names:()=>scenes.map(s=>s.name) };
requestAnimationFrame(frame);
})();
